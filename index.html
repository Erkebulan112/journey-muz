<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Sheksizdik">
    <meta property="og:description" content="Sheksizdik olshenbeidi">
    <meta property="og:image" content="Sheksizdik.jpg">
    <meta property="og:type" content="website">
    <title>Sheksiz alem</title>
    <link rel="preload" href="audio/track1.mp3" as="audio">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💫</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --line-color: rgba(255, 255, 255, 0.12);
            --line-active: rgba(255, 255, 255, 0.85);
            --sphere-border: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: black; overflow-x: hidden; scroll-behavior: smooth;
            animation: fadeInPage 2s ease-in-out;
        }

        /* Star background */
        .stars-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .stars1 { width: 1.5px; height: 1.5px; background: transparent; animation: fallStars 80s linear infinite, twinkle 4s infinite ease-in-out; }
        .stars2 { width: 2.5px; height: 2.5px; background: transparent; animation: fallStars 140s linear infinite, twinkle 6s infinite ease-in-out; }
        .stars1::after, .stars2::after { content: " "; position: absolute; top: 2000px; width: inherit; height: inherit; background: transparent; box-shadow: inherit; }

        @keyframes fallStars { from { transform: translateY(0px); } to { transform: translateY(-2000px); } }
        @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 1; } }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }

        /* Контейнер для эффекта взрыва частиц */
        #particle-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }
        .particle {
            position: absolute; background: white; border-radius: 50%;
            pointer-events: none; opacity: 1;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .roadmap { position: relative; max-width: 1000px; margin: 0 auto; padding: 150px 20px; z-index: 1; }

        .step {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 100px;
            margin-bottom: 300px;
        }

        .step:nth-child(odd) { justify-content: flex-start; }
        .step:nth-child(even) { justify-content: flex-end; }

        /* --- СФЕРЫ --- */
        .sphere {
            width: 95px; height: 95px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px);
            border: 2px solid var(--sphere-border);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Ховер-эффект для десктопов */
        @media (hover: hover) {
            .sphere:hover {
                transform: scale(1.08);
                border-color: rgba(255, 255, 255, 0.8);
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            }
        }

        /* Инстинктивная подсказка для первой сферы (мягкое дыхание до клика) */
        .pulse-hint {
            animation: first-sphere-pulse 2s infinite ease-in-out;
            border-color: rgba(255, 255, 255, 0.7);
        }
        @keyframes first-sphere-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
            50% { transform: scale(1.06); box-shadow: 0 0 25px rgba(255,255,255,0.5); border-color: #fff; }
        }

        /* --- ЭНЕРГЕТИЧЕСКОЕ ЯДРО (АКТИВНАЯ СФЕРА) --- */
        .step.active:not(.paused) .sphere {
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.05) 65%);
            border-color: #ffffff;
            animation: active-energy-glow 2s infinite ease-in-out;
        }
        @keyframes active-energy-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(255,255,255,0.4), inset 0 0 10px rgba(255,255,255,0.2); transform: scale(1.1); }
            50% { box-shadow: 0 0 50px rgba(255,255,255,0.7), inset 0 0 20px rgba(255,255,255,0.5); transform: scale(1.15); }
        }

        /* Состояние паузы (сфера затухает, но сохраняет форму) */
        .step.paused .sphere {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }

        /* --- СТИЛЬ ТЕКСТА --- */
        .lyric-word {
            position: absolute;
            font-family: 'Caveat', cursive;
            font-size: 3.6rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.35);
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
            pointer-events: none;
            white-space: nowrap;
            top: 50%;
            opacity: 0.4;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .step:nth-child(odd) .lyric-word { left: 130px; transform: translateY(-50%) translateX(-15px); }
        .step:nth-child(even) .lyric-word { right: 130px; text-align: right; transform: translateY(-50%) translateX(15px); }

        .step.active .lyric-word { 
            color: #ffffff; 
            text-shadow: 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(255,255,255,0.2); 
            transform: translateY(-50%) translateX(0) scale(1.05) !important; 
            opacity: 1;
        }

        .step.paused:not(:last-child) .lyric-word { 
            color: rgba(255, 255, 255, 0.6); 
            transform: translateY(-50%) translateX(0) scale(1) !important; 
            opacity: 0.7;
        }

        /* --- ОСОБЕННАЯ ФИНАЛЬНАЯ СФЕРА --- */
        .step:last-child .sphere { 
            width: 140px; height: 140px; 
            background: radial-gradient(circle, rgba(163,0,54,0.15), rgba(0,0,0,0.8)); 
            border: 2px solid rgba(163, 0, 54, 0.4); 
            box-shadow: 0 0 25px rgba(163,0,54,0.2); 
        }
        .step:last-child .lyric-word { left: 180px; }
        
        .step:last-child.active:not(.paused) .sphere {
            background: radial-gradient(circle, #ff0055 0%, rgba(163,0,54,0.1) 70%);
            border-color: #ff0055;
            animation: final-glow 2.5s infinite ease-in-out;
        }
        @keyframes final-glow {
            0%, 100% { box-shadow: 0 0 30px rgba(255,0,85,0.5), inset 0 0 15px rgba(255,0,85,0.3); transform: scale(1.08); }
            50% { box-shadow: 0 0 60px rgba(255,0,85,0.8), inset 0 0 25px rgba(255,0,85,0.6); transform: scale(1.12); }
        }
        .step:last-child.active .lyric-word { 
            color: #ff0055; 
            text-shadow: 0 0 25px #ff0055, 0 0 50px rgba(255,0,85,0.4); 
        }

        /* Базовый стиль для всех устройств */
        .path-svg {
         position: absolute;
            top: 50px;
            left: 0;
            width: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: visible;
        }

.main-path { 
    fill: none; 
    stroke: var(--line-color); 
    stroke-width: 1.5; 
    stroke-dasharray: 6; 
}

.progress-path { 
    fill: none; 
    stroke: var(--line-active); 
    stroke-width: 3; 
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
    transition: stroke-dashoffset 0.1s linear;
    will-change: stroke-dashoffset;
}

/* Настройки для ВЕБА */
@media (min-width: 601px) {
    .path-svg {
        height: 300px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 1000px; 
    }
}

/* Настройки для МОБИЛКИ */
@media (max-width: 600px) {
    .path-svg {
        height: 220px; /* Соответствует margin-bottom шага */
    }
    .path-svg path {
        vector-effect: non-scaling-stroke;
    }
    .lyric-word { font-size: 2.2rem; letter-spacing: 1px; }
    .sphere { width: 75px; height: 75px; }
    .step { margin-bottom: 220px; }
    .step:nth-child(odd) .lyric-word { left: 95px; }
    .step:nth-child(even) .lyric-word { right: 95px; }
    .step:last-child .sphere { width: 110px; height: 110px; }
    .step:last-child .lyric-word { left: 135px; }
}
    </style>
</head>
<body>

<div class="stars-background">
    <div class="stars1" id="stars1"></div>
    <div class="stars2" id="stars2"></div>
</div>

<div id="particle-container"></div>

<div class="roadmap">
    <div class="step" data-index="1">
        <div class="sphere pulse-hint" onclick="handleSphereClick(1, event)"></div>
        <div class="lyric-word">Senen kein</div>
        <svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="main-path" d="M 20 10 Q 80 10 80 90" /><path class="progress-path" d="M 20 10 Q 80 10 80 90" /></svg>
    </div>

    <div class="step" data-index="2">
        <div class="sphere" onclick="handleSphereClick(2, event)"></div>
        <div class="lyric-word">Jalğyz gül</div>
        <svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="main-path" d="M 80 10 Q 20 10 20 90" /><path class="progress-path" d="M 80 10 Q 20 10 20 90" /></svg>
    </div>

    <div class="step" data-index="3">
        <div class="sphere" onclick="handleSphereClick(3, event)"></div>
        <div class="lyric-word">Bır oilap alam</div>
        <svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="main-path" d="M 20 10 Q 80 10 80 90" /><path class="progress-path" d="M 20 10 Q 80 10 80 90" /></svg>
    </div>

    <div class="step" data-index="4">
        <div class="sphere" onclick="handleSphereClick(4, event)"></div>
        <div class="lyric-word">Sheksizdiktei...</div>
        <svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="main-path" d="M 80 10 Q 20 10 20 90" /><path class="progress-path" d="M 80 10 Q 20 10 20 90" /></svg>
    </div>

    <div class="step" data-index="5">
        <div class="sphere" onclick="handleSphereClick(5, event)"></div>
        <div class="lyric-word">Menı küt</div>
        <svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="main-path" d="M 20 10 Q 80 10 80 90" /><path class="progress-path" d="M 20 10 Q 80 10 80 90" /></svg>
    </div>

    <div class="step" data-index="6">
        <div class="sphere" onclick="handleSphereClick(6, event)"></div>
        <div class="lyric-word">Jalğyz jūldyz</div>
        <svg class="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="main-path" d="M 80 10 Q 20 10 20 90" /><path class="progress-path" d="M 80 10 Q 20 10 20 90" /></svg>
    </div>

    <div class="step" data-index="7">
        <div class="sphere" onclick="handleSphereClick(7, event)"></div>
        <div class="lyric-word">Sen bılesıñ</div>
    </div>
</div>

<audio id="core-player"></audio>

<script>
    // 1. Инициализация звездного фона
function createStars() {
    const l1 = document.getElementById('stars1'), l2 = document.getElementById('stars2');
    let s1 = "", s2 = "";
    for(let i=0; i<350; i++) s1 += `${Math.random()*2000}px ${Math.random()*2000}px rgba(255,255,255,${0.08+Math.random()*0.3})${i<349?', ':''}`;
    for(let i=0; i<120; i++) s2 += `${Math.random()*2000}px ${Math.random()*2000}px rgba(255,255,255,${0.2+Math.random()*0.4})${i<119?', ':''}`;
    l1.style.boxShadow = s1; l2.style.boxShadow = s2;
}
createStars();

// 2. Эффект взрыва частиц
function explodeParticles(x, y, isFinal = false) {
    const container = document.getElementById('particle-container');
    const particleCount = isFinal ? 60 : 35;
    
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        if (isFinal) {
            particle.style.background = `hsl(${340 + Math.random() * 20}, 100%, 60%)`;
            particle.style.boxShadow = '0 0 10px #ff0055';
        } else {
            particle.style.background = '#ffffff';
        }
        
        const size = Math.random() * 4 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        
        container.appendChild(particle);
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 120 + 40;
        const destinationX = Math.cos(angle) * velocity;
        const destinationY = Math.sin(angle) * velocity;
        
        const animation = particle.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 1 },
            { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
        ], {
            duration: Math.random() * 600 + 600,
            easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
        });
        
        animation.onfinish = () => particle.remove();
    }
}

// 3. Логика плеера и анимации линий
const player = document.getElementById('core-player');
let currentTrack = 0;

function startPlay(index) {
    currentTrack = index;
    
    // Сбрасываем классы у всех шагов
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active', 'paused'));

    const currentStep = document.querySelector(`.step[data-index="${index}"]`);
    if (currentStep) {
        currentStep.classList.add('active');
        currentStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        // Подготавливаем линию: измеряем её реальную длину
        const progLine = currentStep.querySelector('.progress-path');
        if (progLine) {
            const length = progLine.getTotalLength();
            progLine.style.strokeDasharray = length;
            progLine.style.strokeDashoffset = length;
        }
    }

    player.src = `audio/track${index}.mp3`;
    player.play().catch(e => console.log("Ожидание взаимодействия пользователя"));
}

function handleSphereClick(index, event) {
    if(index === 1) {
        const firstSphere = document.querySelector('.sphere');
        if(firstSphere) firstSphere.classList.remove('pulse-hint');
    }

    const rect = event.target.getBoundingClientRect();
    const centerX = rect.left + window.scrollX + rect.width / 2;
    const centerY = rect.top + window.scrollY + rect.height / 2;
    
    explodeParticles(centerX, centerY, index === 7);

    if (currentTrack === index) {
        if (player.paused) {
            player.play();
            document.querySelector(`.step[data-index="${index}"]`).classList.remove('paused');
        } else {
            player.pause();
            document.querySelector(`.step[data-index="${index}"]`).classList.add('paused');
        }
    } else {
        startPlay(index);
    }
}

// Обновление прогресса линии (динамический расчет)
player.ontimeupdate = function() {
    if (currentTrack > 0 && currentTrack < 7) {
        const currentStep = document.querySelector(`.step[data-index="${currentTrack}"]`);
        const progLine = currentStep ? currentStep.querySelector('.progress-path') : null;
        
        if (progLine && player.duration) {
            const length = progLine.getTotalLength(); 
            const percent = player.currentTime / player.duration;
            progLine.style.strokeDasharray = length;
            progLine.style.strokeDashoffset = length - (percent * length);
        }
    }
};

player.onended = function() {
    if (currentTrack < 7) startPlay(currentTrack + 1);
};
</script>
</body>
</html>
